name: Trivy Vulnerability Scan

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t foodflow-backend:test ./backend
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: foodflow-backend:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          # SARIF includes every severity by default; align the report and exit
          # policy with the release gate above instead of failing on MEDIUM/LOW.
          limit-severities-for-sarif: true
      - name: Upload results
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 14
